<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>
<body>
    <header>
        <h1>Veterinaria Aurora</h1>
    </header>
    <main>
        
<section class="contactForm">
    <h1>Contáctanos</h1>
    <p>Completa este formulario y nos comunicaremos directo contigo!</p>

    <form id="contactForm">
        <label for="name">Nombre Completo:</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="email">Correo Electrónico:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="consultation">Tipo de Consulta</label>
        <select
            id="consultation"
            name="consultation"
            required
        >
            <option value="">Selecciona una consulta</option>
            <option value="general">Chequeo General</option>
            <option value="vaccination">Vacunación</option>
            <option value="emergency">Urgencias</option>
            <option value="styling">Peluquería</option>
            <option value="other">Otro</option>
        </select>

        <label for="message">Explicación corta (máximo 500 caracteres):</label>
        <textarea
            id="message"
            name="message"
            rows="5"
            maxlength="500"
            placeholder="Cuéntanos cómo ayudar..."
            required
        ></textarea>

        <small id="char-counter">0 / 500 caracteres</small>

        <button type="submit">Enviar</button>

    </form>
</section>

    </main>
</body>
</html>
